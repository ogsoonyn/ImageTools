<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ツール名</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- common:begin theme-init -->
<script>
  // 描画前に保存済みテーマを反映してちらつきを防ぐ（localStorage が使えなくても動く）
  (() => {
    try {
      const t = localStorage.getItem("imagetools:theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) { /* 保存領域が使えない環境では OS 設定に従う */ }
  })();
</script>
<!-- common:end theme-init -->
<!-- 共通のスタイルと、このツール固有のスタイル(tool-name はファイル名に置き換える) -->
<link rel="stylesheet" href="../src/common/style.css">
<link rel="stylesheet" href="../src/tools/tool-name/style.css">
</head>
<body>
<div class="wrap">
  <!-- common:begin header -->
  <header class="app-header">
    <div class="min-w-0">
      <a class="back" href="../index.html">← ツール一覧</a>
      <h1 class="text-xl font-bold">ツール名</h1>
      <p class="hint">ツールの説明（1〜2行）。処理はすべてブラウザ内で完結します。</p>
    </div>
    <div class="actions">
      <!-- ツール固有のヘッダーボタンはここに追加 -->
      <button class="btn btn-ghost" type="button" id="themeToggle">テーマ: 自動</button>
    </div>
  </header>
  <!-- common:end header -->

  <!-- ---- ここから下はツール固有の本体（サンプル実装。置き換えて使う） ---- -->
  <div class="grid-main">
    <aside class="panel p-4 flex flex-col gap-5">
      <section class="flex flex-col gap-2">
        <h2 class="sec-title">入力</h2>
        <label class="drop" id="drop" for="fileInput">
          <span class="text-sm">画像をドロップ、またはクリックして選択</span><br>
          <span class="hint">ページのどこにドロップしても受け付けます</span>
        </label>
        <input type="file" id="fileInput" class="sr-only" accept="image/*" multiple>
        <p class="hint" id="srcNote">未読み込み</p>
      </section>
      <section class="flex flex-col gap-2">
        <h2 class="sec-title">出力</h2>
        <div class="flex gap-2 flex-wrap">
          <button class="btn btn-primary" type="button" id="btnPng" disabled>PNGを保存</button>
          <button class="btn" type="button" id="btnJson" disabled>JSONを保存</button>
        </div>
      </section>
    </aside>
    <main class="panel p-4 min-w-0">
      <h2 class="sec-title mb-2">プレビュー</h2>
      <div class="stage bg-checker"><canvas id="preview" width="256" height="128" aria-label="プレビュー"></canvas></div>
    </main>
  </div>
</div>

<!-- common:begin toast -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- common:end toast -->

<!-- ツール固有のスクリプト。共通 JS(IT)は main.ts から import する -->
<script type="module" src="../src/tools/tool-name/main.ts"></script>
</body>
</html>
