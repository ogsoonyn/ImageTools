<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ツール名</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- common:begin theme-init -->
<script>
  // 描画前に保存済みテーマを反映してちらつきを防ぐ（localStorage が使えなくても動く）
  (() => {
    try {
      const t = localStorage.getItem("imagetools:theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) { /* 保存領域が使えない環境では OS 設定に従う */ }
  })();
</script>
<!-- common:end theme-init -->
<style>
/* common:begin theme-vars */
/* テーマ変数。既存ツールの変数名（--bg/--panel/--line/--fg/--muted/--accent/--accent-fg/--warn/--chk-*）を踏襲し、
   Aseprite 側の名前（--surface/--surface-2/--accent-soft/--danger/--checker-*）も別名として用意する */
:root{
  --bg:#eef1f3; --panel:#ffffff; --surface-2:#e4e8ec; --line:#d6dce1; --fg:#1b2329; --muted:#5d6b75;
  --accent:#0d7f86; --accent-fg:#ffffff; --accent-soft:#d4eef0; --warn:#a1560b; --danger:#b42318;
  --chk-a:#ffffff; --chk-b:#d9dde1;
  --surface:var(--panel); --checker-a:var(--chk-a); --checker-b:var(--chk-b);
  --font-body:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  --font-mono:ui-monospace,"Cascadia Mono",Consolas,"JetBrains Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171b; --panel:#1a2126; --surface-2:#232b31; --line:#2c363d; --fg:#e3e9ed; --muted:#93a2ad;
  --accent:#3cc3c6; --accent-fg:#0b1417; --accent-soft:#163a3d; --warn:#e7a35a; --danger:#ff8a7a;
  --chk-a:#2a3238; --chk-b:#20272c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171b; --panel:#1a2126; --surface-2:#232b31; --line:#2c363d; --fg:#e3e9ed; --muted:#93a2ad;
  --accent:#3cc3c6; --accent-fg:#0b1417; --accent-soft:#163a3d; --warn:#e7a35a; --danger:#ff8a7a;
  --chk-a:#2a3238; --chk-b:#20272c; color-scheme:dark}
/* common:end theme-vars */

/* common:begin base */
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,p,dl,dd{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--font-body);font-size:14px;line-height:1.6}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;max-width:1280px;margin:0 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{text-wrap:balance}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* common:end base */

/* common:begin utilities */
/* Tailwind 互換の最小ユーティリティ（CDN 不使用。使うクラスだけ書き足す） */
.flex{display:flex}.grid{display:grid}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}
.items-center{align-items:center}.items-end{align-items:flex-end}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}.gap-5{gap:20px}
.mb-2{margin-bottom:8px}.mb-4{margin-bottom:16px}.mt-2{margin-top:8px}.p-3{padding:12px}.p-4{padding:16px}
.min-w-0{min-width:0}.w-full{width:100%}
.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.sm\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.text-xs{font-size:12px}.text-sm{font-size:13px}.text-xl{font-size:20px;line-height:1.4}.font-bold{font-weight:700}
.text-muted{color:var(--muted)}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
/* common:end utilities */

/* common:begin components */
/* daisyUI 風コンポーネント（必要分のみ） */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.sec-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hint{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:7px;padding:6px 12px;font-size:13px;font-weight:500;line-height:1.4;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent}
.btn-sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.is-active,.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.join{display:inline-flex;flex-wrap:wrap}
.join>.btn{border-radius:0;margin-left:-1px}
.join>.btn:first-child{border-radius:7px 0 0 7px;margin-left:0}
.join>.btn:last-child{border-radius:0 7px 7px 0}
.select,.input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--fg);font-family:var(--font-mono);font-size:13px;min-width:0}
.range{width:100%;accent-color:var(--accent)}
.checkbox{accent-color:var(--accent);margin:0}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--accent);color:var(--accent-fg)}
.warn{color:var(--warn)}.danger{color:var(--danger)}
.drop{display:block;border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.bg-checker{background-color:var(--chk-a);background-image:linear-gradient(45deg,var(--chk-b) 25%,transparent 25%,transparent 75%,var(--chk-b) 75%),linear-gradient(45deg,var(--chk-b) 25%,transparent 25%,transparent 75%,var(--chk-b) 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.stage{border-radius:8px;border:1px solid var(--line);overflow:auto;max-height:70vh;display:flex;align-items:flex-start;justify-content:center;padding:12px}
.stage canvas{max-width:100%;height:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
/* common:end components */

/* common:begin header-style */
.app-header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:16px}
.app-header .back{font-size:12px;color:var(--muted);text-decoration:none}
.app-header .back:hover{color:var(--accent)}
.app-header .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* common:end header-style */

/* ---- ここから下はツール固有のスタイル ---- */
/* Layout: 左 = 設定パネル（固定幅）, 右 = プレビュー。狭幅では縦積み */
.grid-main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid-main{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <!-- common:begin header -->
  <header class="app-header">
    <div class="min-w-0">
      <a class="back" href="../index.html">← ツール一覧</a>
      <h1 class="text-xl font-bold">ツール名</h1>
      <p class="hint">ツールの説明（1〜2行）。処理はすべてブラウザ内で完結します。</p>
    </div>
    <div class="actions">
      <!-- ツール固有のヘッダーボタンはここに追加 -->
      <button class="btn btn-ghost" type="button" id="themeToggle" aria-label="テーマ切替">テーマ: 自動</button>
    </div>
  </header>
  <!-- common:end header -->

  <!-- ---- ここから下はツール固有の本体（サンプル実装。置き換えて使う） ---- -->
  <div class="grid-main">
    <aside class="panel p-4 flex flex-col gap-5">
      <section class="flex flex-col gap-2">
        <h2 class="sec-title">入力</h2>
        <label class="drop" id="drop" for="fileInput">
          <span class="text-sm">画像をドロップ、またはクリックして選択</span><br>
          <span class="hint">ページのどこにドロップしても受け付けます</span>
        </label>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
        <p class="hint" id="srcNote">未読み込み</p>
      </section>
      <section class="flex flex-col gap-2">
        <h2 class="sec-title">出力</h2>
        <div class="flex gap-2 flex-wrap">
          <button class="btn btn-primary" type="button" id="btnPng" disabled>PNGを保存</button>
          <button class="btn" type="button" id="btnJson" disabled>JSONを保存</button>
        </div>
      </section>
    </aside>
    <main class="panel p-4 min-w-0">
      <h2 class="sec-title mb-2">プレビュー</h2>
      <div class="stage bg-checker"><canvas id="preview" width="256" height="128" aria-label="プレビュー"></canvas></div>
    </main>
  </div>
</div>

<!-- common:begin toast -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- common:end toast -->

<!-- common:begin common-js -->
<script>
/* 共通 JS。各ツールはこのブロックをそのままコピーし、下の「ツール固有」スクリプトから IT.* を使う */
const IT = (() => {
  const PREFIX = "imagetools:";

  // ---- localStorage の安全な読み書き（プライベートモード等で例外になっても落ちない） ----
  const store = {
    get(key, fallback = null) {
      try { const v = localStorage.getItem(PREFIX + key); return v === null ? fallback : JSON.parse(v); }
      catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); return true; }
      catch (e) { return false; }
    },
    remove(key) {
      try { localStorage.removeItem(PREFIX + key); } catch (e) { /* 無視 */ }
    },
  };

  // ---- トースト ----
  let toastTimer = 0;
  function toast(msg, ms = 2400) {
    const t = document.getElementById("toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), ms);
  }

  // ---- テーマ切替（自動 → ライト → ダーク の順に循環） ----
  // theme-init は生の文字列で読むため、ここも JSON を介さず同じキーに文字列で保存する
  const THEME_KEY = PREFIX + "theme";
  const THEME_LABEL = { auto: "テーマ: 自動", light: "テーマ: ライト", dark: "テーマ: ダーク" };
  function getTheme() {
    const t = document.documentElement.dataset.theme;
    return t === "light" || t === "dark" ? t : "auto";
  }
  function applyTheme(theme) {
    const root = document.documentElement;
    if (theme === "light" || theme === "dark") root.dataset.theme = theme;
    else delete root.dataset.theme;
    try {
      if (theme === "auto") localStorage.removeItem(THEME_KEY);
      else localStorage.setItem(THEME_KEY, theme);
    } catch (e) { /* 保存できなくても切替自体は有効 */ }
    const btn = document.getElementById("themeToggle");
    if (btn) btn.textContent = THEME_LABEL[getTheme()];
  }
  function initThemeToggle() {
    const btn = document.getElementById("themeToggle");
    if (!btn) return;
    btn.textContent = THEME_LABEL[getTheme()];
    btn.addEventListener("click", () => {
      const next = { auto: "light", light: "dark", dark: "auto" }[getTheme()];
      applyTheme(next);
      toast(THEME_LABEL[next]);
    });
  }

  // ---- ファイル保存（Claude アーティファクトでは downloads、通常ブラウザでは <a download>） ----
  let downloadsP = null;
  if (window.claude && typeof window.claude.use === "function") {
    downloadsP = Promise.resolve().then(() => window.claude.use("downloads")).catch(() => null);
  }
  async function saveFile(filename, data) {
    const dl = downloadsP ? await downloadsP : null;
    if (dl) {
      try { await dl.save({ filename, data }); toast(filename + " を保存しました"); }
      catch (e) { toast(e && e.code === "declined" ? "保存をキャンセルしました" : "保存できませんでした（" + ((e && e.code) || "error") + "）"); }
      return;
    }
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(filename + " を保存しました");
  }
  function canvasToBlob(canvas, type = "image/png") {
    return new Promise((res, rej) => canvas.toBlob((b) => (b ? res(b) : rej(new Error("toBlob failed"))), type));
  }

  // ---- ドラッグ&ドロップ受付（ページ全体で受け、zone に .over を付ける） ----
  // accept: ファイルを絞る関数（省略時はすべて）。onFiles には絞り込み後の File[] を渡す
  function initDrop({ zone, input, accept = () => true, onFiles, emptyMessage = "対応するファイルが見つかりませんでした" }) {
    const zoneEl = typeof zone === "string" ? document.getElementById(zone) : zone;
    const inputEl = typeof input === "string" ? document.getElementById(input) : input;
    const handle = (list) => {
      const files = [...(list || [])].filter(accept);
      if (!files.length) { toast(emptyMessage); return; }
      onFiles(files);
    };
    let depth = 0;
    const hasFiles = (e) => !!e.dataTransfer && [...e.dataTransfer.types].includes("Files");
    document.addEventListener("dragenter", (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault(); depth++; zoneEl && zoneEl.classList.add("over");
    });
    document.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
    document.addEventListener("dragleave", (e) => {
      if (!hasFiles(e)) return;
      depth = Math.max(0, depth - 1);
      if (!depth && zoneEl) zoneEl.classList.remove("over");
    });
    document.addEventListener("drop", (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault(); depth = 0; zoneEl && zoneEl.classList.remove("over");
      handle(e.dataTransfer.files);
    });
    if (inputEl) inputEl.addEventListener("change", (e) => { handle(e.target.files); e.target.value = ""; });
  }

  initThemeToggle();
  return { store, toast, saveFile, canvasToBlob, initDrop, applyTheme, getTheme };
})();
</script>
<!-- common:end common-js -->

<script>
/* ---- ここから下はツール固有のスクリプト（サンプル実装。置き換えて使う） ---- */
const $ = (id) => document.getElementById(id);
const preview = $("preview");
const pctx = preview.getContext("2d");
let loaded = []; // {name, w, h}

function drawPlaceholder() {
  pctx.clearRect(0, 0, preview.width, preview.height);
  pctx.fillStyle = "rgba(127,127,127,.35)";
  pctx.fillRect(0, 0, preview.width, preview.height);
}

async function loadImages(files) {
  const imgs = [];
  for (const f of files) {
    try {
      const bmp = await createImageBitmap(f);
      imgs.push({ name: f.name, bmp });
    } catch (e) {
      IT.toast(f.name + " を読み込めませんでした");
    }
  }
  if (!imgs.length) return;
  // サンプル: 横に並べて 1 枚にする
  const W = imgs.reduce((s, i) => s + i.bmp.width, 0);
  const H = Math.max(...imgs.map((i) => i.bmp.height));
  preview.width = W; preview.height = H;
  let x = 0;
  for (const i of imgs) { pctx.drawImage(i.bmp, x, 0); x += i.bmp.width; i.bmp.close(); }
  loaded = imgs.map((i) => ({ name: i.name }));
  $("srcNote").textContent = imgs.length + " 枚を読み込みました（" + W + "×" + H + "）";
  $("btnPng").disabled = $("btnJson").disabled = false;
  IT.store.set("template:lastCount", imgs.length);
}

IT.initDrop({
  zone: "drop",
  input: "fileInput",
  accept: (f) => f.type.startsWith("image/"),
  onFiles: loadImages,
  emptyMessage: "画像ファイルが見つかりませんでした",
});

$("btnPng").addEventListener("click", async () => {
  try { await IT.saveFile("output.png", await IT.canvasToBlob(preview)); }
  catch (e) { IT.toast("PNGを作成できませんでした"); }
});
$("btnJson").addEventListener("click", () => {
  const json = JSON.stringify({ size: { w: preview.width, h: preview.height }, sources: loaded }, null, 2);
  IT.saveFile("output.json", new Blob([json], { type: "application/json" }));
});

drawPlaceholder();
</script>
</body>
</html>
